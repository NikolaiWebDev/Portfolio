<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Калькулятор</title>
</head>
<body>

    <main style="margin-top:50px ;" id="CalcApp">
        <section id="calcflex">
            <div id="backgroundCalc"><div id="textboxBackground"><span class="value"><p id="calcResultNum">0</p></span></div>
            <div id="backbuttons">
                <section  class="flexbuttons"><div id="buttonDivision" class="sizeButtons"><span class="TextInButtons">÷</span></div><div id="buttonMultiplication" class="sizeButtons"><span class="TextInButtons">×</span></div><div id="buttonMinus" class="sizeButtons"><span class="TextInButtons">−</span></div><div id="buttonPlus" class="sizeButtons"><span class="TextInButtons">+</span></div></section>
                <section  class="flexbuttons"><div id="buttonOne" class="sizeButtons"><span class="TextInButtons">1</span></div><div id="buttonTwo" class="sizeButtons"><span class="TextInButtons">2</span></div><div id="buttonThree" class="sizeButtons"><span class="TextInButtons">3</span></div><div class="sizeButtons"><span id="buttondel" style="margin-left: 14px; margin-top: 8px;" class="TextInButtons">⌫</span></div></section>
                <section  class="flexbuttons"><div id="buttonFour" class="sizeButtons"><span class="TextInButtons">4</span></div><div id="buttonFive" class="sizeButtons"><span class="TextInButtons">5</span></div><div id="buttonSix" class="sizeButtons"><span class="TextInButtons">6</span></div><div id="buttonClear" class="sizeButtons"><span style="margin-left: 26px; font-family: sans-serif;" class="TextInButtons">C</span></div></section>
                <section  class="flexbuttons"><div id="buttonSeven" class="sizeButtons"><span class="TextInButtons">7</span></div><div id="buttonEight" class="sizeButtons"><span  class="TextInButtons">8</span></div><div id="buttonNine"  class="sizeButtons"><span class="TextInButtons">9</span></div><div id="buttonEqually" class="sizeButtons"><span class="TextInButtons">=</span></div></section>
                <section  class="flexbuttonslast"><div id="buttonZero" class="sizeButtons"><span class="TextInButtons">0</span></div> <div id="buttonDot" class="sizeButtons"><span style="margin-top: 15px; margin-left: 32px;" class="TextInButtons">•</span></div></section>
                <p id="Calculatortext">Calculator</p>
                
            </div>
        </div>
            
        </section>
    </main>
</body>
<script src="app.js"></script>
</html>
